# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin/tin tức trên internet (qua Tavily). Bước 1 của pipeline tin tức: dùng để tìm bài viết phù hợp trước khi fetch nội dung đầy đủ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung đầy đủ từ một URL cụ thể (qua Firecrawl). Bước 2 của pipeline tin tức: dùng trên URL bài viết tốt nhất lấy được từ lookup, hoặc khi người dùng đã đưa sẵn một URL."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có (từ lookup/fetch/timeline/social_search/wiki_lookup) thành digest markdown, giữ url nguồn trong từng item. Bước 3 của pipeline tin tức, trước khi viết tóm tắt AI. Không tự fetch/tìm dữ liệu."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  - name: wiki_lookup
    description: "Tóm tắt nền tảng từ Wikipedia cho một chủ đề/người/khái niệm cụ thể (định nghĩa, tiểu sử, sự kiện lịch sử). Không dùng cho tin tức thời sự mới nhất (dùng lookup) hoặc khi đã có URL cụ thể (dùng fetch)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề/thực thể cần tra cứu"}
        lang: {type: string, default: "en", description: "Mã ngôn ngữ Wikipedia, ví dụ en, vi"}
      required: [query]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản (tóm tắt AI kèm link nguồn bài viết/paper) lên Telegram. Hành động nhạy cảm: chỉ gọi với confirmed=true SAU KHI đã clarify(response_type=yes_no) và người dùng xác nhận đồng ý ở turn trước."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung gửi đi — nên là tóm tắt AI kèm link nguồn"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận; chỉ true sau khi người dùng đã đồng ý qua clarify yes_no"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học trên arXiv. Bước 1 của pipeline paper: dùng để tìm paper phù hợp trước khi đọc nội dung chi tiết bằng paper_text."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Tải và trích text nội dung chi tiết của một paper arXiv cụ thể (theo arxiv_url/id). Bước 2 của pipeline paper: dùng trên paper tốt nhất lấy được từ papers, trước khi viết tóm tắt AI."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
